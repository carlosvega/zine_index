<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stories and photographs by Carlos Vega.">
  <title>Zine</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #080808;
      --foreground: #f2f0eb;
      --muted: #aaa8a3;
      --line: #2a2a2a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--foreground);
      background: var(--background);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      z-index: -1;
      inset: -35vmax;
      background:
        radial-gradient(circle at 24% 28%, rgba(50, 86, 151, 0.25), transparent 29%),
        radial-gradient(circle at 76% 68%, rgba(74, 68, 138, 0.18), transparent 32%),
        radial-gradient(circle at 52% 92%, rgba(28, 72, 108, 0.14), transparent 36%);
      background-size: 115% 115%, 120% 120%, 125% 125%;
      background-position: 0% 10%, 100% 70%, 50% 100%;
      transform: translate3d(-3%, -2%, 0) scale(1.02);
      animation: ambient-light 30s ease-in-out infinite alternate;
      pointer-events: none;
    }

    main {
      width: min(100%, 960px);
    }

    header {
      margin-bottom: clamp(48px, 10vh, 112px);
    }

    h1 {
      margin: 0 0 12px;
      font-family: Georgia, serif;
      font-size: clamp(48px, 10vw, 112px);
      font-style: italic;
      font-weight: 400;
      line-height: 0.9;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    nav {
      border-top: 1px solid var(--line);
    }

    a {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 28px 0;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: padding-inline 260ms ease, border-color 260ms ease;
    }

    a::before {
      content: '';
      position: absolute;
      inset: 8px -16px;
      z-index: -1;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.035);
      opacity: 0;
      transform: scaleX(0.985);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    a:hover,
    a:focus-visible {
      padding-inline: 12px;
      border-color: #4a4a4a;
    }

    a:hover::before,
    a:focus-visible::before {
      opacity: 1;
      transform: scaleX(1);
    }

    a:focus-visible {
      outline: 1px solid var(--foreground);
      outline-offset: 8px;
    }

    h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 400;
      transition: color 260ms ease, transform 260ms ease;
    }

    article p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      transition: color 260ms ease;
    }

    a:hover h2,
    a:focus-visible h2 {
      color: #fff;
      transform: translateX(2px);
    }

    a:hover article p,
    a:focus-visible article p {
      color: #c8c5bf;
    }

    .arrow {
      font-size: 24px;
      transition: transform 180ms ease;
    }

    a:hover .arrow,
    a:focus-visible .arrow {
      transform: translateX(6px);
    }

    @keyframes ambient-light {
      0% {
        transform: translate3d(-3%, -2%, 0) scale(1.02);
        filter: brightness(0.9) saturate(0.95);
      }

      50% {
        transform: translate3d(4%, 2%, 0) scale(1.09);
        filter: brightness(1.08) saturate(1.12);
      }

      100% {
        transform: translate3d(-2%, 5%, 0) scale(1.05);
        filter: brightness(0.96) saturate(1.04);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      a,
      a::before,
      h2,
      article p,
      .arrow {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Zine</h1>
      <p>Stories and photographs by Carlos Vega</p>
    </header>

    <nav aria-label="Projects">
      <a href="https://delayed.zine.lu">
        <article>
          <h2>Delayed</h2>
          <p>How commuting affects us · Luxembourg</p>
        </article>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a href="https://ghana.zine.lu">
        <article>
          <h2>Beyond access</h2>
          <p>Menstrual health and the school day · Ghana</p>
        </article>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
